# Port 80 does two things and neither is serving the app: it answers Let's
# Encrypt, and it sends everybody else to https.
server {
    listen 80;
    server_name _;

    # The ACME challenge. certbot drops a file in /var/www/certbot and Let's
    # Encrypt comes to read it, over http, before there is any certificate. It
    # goes BEFORE the redirect: redirecting the challenge breaks the renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name labelstudio.suyana.io;

    ssl_certificate     /etc/letsencrypt/live/labelstudio.suyana.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labelstudio.suyana.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Exports of a big project go through here, and so does any file upload.
    client_max_body_size 500M;

    # The chips, served as plain static files. make_tasks.py points the tasks
    # here with --base-url http://<host>/chips
    #
    # This replaces LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED, which hands Label
    # Studio the whole filesystem and has no place outside a laptop.
    location /chips/ {
        alias /srv/chips/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Label Studio streams progress over websockets while it imports.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
    }
}
