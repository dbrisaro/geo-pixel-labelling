server {
    listen 80;
    server_name _;

    # Exports of a big project go through here, and so does any file upload.
    client_max_body_size 500M;

    # The chips, served as plain static files. make_tasks.py points the tasks
    # here with --base-url http://<host>/chips
    #
    # This replaces LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED, which hands Label
    # Studio the whole filesystem and has no place outside a laptop.
    location /chips/ {
        alias /srv/chips/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Label Studio streams progress over websockets while it imports.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
    }
}
